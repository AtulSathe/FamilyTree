name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'backend/FamilyTree.sln'
  API_PROJECT_PATH: 'backend/FamilyTree.Api'

jobs:
  # ── Build + Test ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Run tests
        # USE_MOCK_AUTH=true is also set in FamilyTreeTestFactory constructor,
        # but exporting here ensures it's visible before any host is created.
        env:
          USE_MOCK_AUTH: 'true'
        run: >
          dotnet test ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()   # upload even when tests fail so failures are visible
        with:
          name: test-results
          path: ./test-results

      # Only publish when pushing to main (not on pull_request)
      - name: Publish API
        if: github.event_name == 'push'
        run: >
          dotnet publish ${{ env.API_PROJECT_PATH }}
          --configuration Release
          --no-build
          --output ./publish

      - name: Upload publish artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./publish
          retention-days: 1

  # ── Deploy to Azure App Service ───────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only deploy on direct push to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          # Set AZURE_WEBAPP_NAME in repo Settings → Variables → Actions
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          # Set AZURE_WEBAPP_PUBLISH_PROFILE in repo Settings → Secrets → Actions
          # Download from Azure Portal → App Service → Get publish profile
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
